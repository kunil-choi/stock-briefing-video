name: 📝 Generate Broadcast Script

on:
  schedule:
    - cron: "30 0 * * 1-5"  # 안전망: KST 09:30 Mon-Fri (stock-briefing-v3의 dispatch 실패 시 대비)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 패키지 설치
        run: |
          pip install openai playwright Pillow pandas matplotlib pykrx requests python-dotenv
          playwright install chromium

      - name: 📝 원고 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python pipeline/generate_script.py

      - name: 💾 결과물 저장
        uses: actions/upload-artifact@v4
        with:
          name: generated-script-latest
          path: output/KO/scripts/
          retention-days: 30
          overwrite: true
