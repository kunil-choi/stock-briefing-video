name: 🎬 Generate Video

on:
  workflow_run:
    workflows: ["🖼️ Generate Assets"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔤 한글 폰트 · ffmpeg · libass 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            ffmpeg \
            libass-dev \
            libass9
          fc-cache -fv
          echo "✅ libass 버전: $(dpkg -l libass9 | tail -1)"
          echo "✅ ffmpeg 버전: $(ffmpeg -version | head -1)"

      - name: 📦 Python 패키지 설치
        run: |
          pip install \
            requests \
            Pillow>=10.0.0 \
            openai>=1.0.0

      - name: 📥 script artifact 다운로드
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: generate_script.yml
          name: generated-script-latest
          path: output/KO/scripts/
          if_no_artifact_found: fail
          workflow_conclusion: success

      - name: 📥 voice artifact 다운로드
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: generate_voice.yml
          name: generated-voice-latest
          path: output/KO/audio/
          if_no_artifact_found: fail
          workflow_conclusion: success

      - name: 📥 assets artifact 다운로드
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: generate_assets.yml
          name_is_regexp: true
          name: generated-assets-.*
          path: output/KO/frames_raw/
          if_no_artifact_found: fail
          workflow_conclusion: success

      - name: 🗂️ frames 폴더 정리 및 asset_map.json 생성
        run: |
          python pipeline/build_asset_map.py
          echo "📋 asset_map 내용:"
          python -c "
          import json
          with open('output/KO/asset_map.json') as f:
              m = json.load(f)
          frames = m.get('frames', [])
          print(f'  총 프레임: {len(frames)}개')
          for p in frames:
              import os
              print(f'  {os.path.basename(p)}')
          "

      - name: 📝 ASS 자막 생성
        continue-on-error: true
        run: |
          echo "📝 ASS 자막 파일 생성 중..."
          python pipeline/generate_subtitles.py KO
          if [ -f "output/KO/subtitles/subtitle.ass" ]; then
            echo "✅ 자막 파일 생성 완료"
            wc -l output/KO/subtitles/subtitle.ass
          else
            echo "⚠️ 자막 파일 생성 실패 (영상 생성은 계속)"
          fi

      - name: 🎬 동영상 생성
        run: |
          echo "🎬 동영상 합성 시작..."
          python pipeline/generate_video.py KO
          echo "📊 생성된 파일 정보:"
          ls -lh output/KO/video/ 2>/dev/null || echo "video 폴더 없음"

      - name: 💾 최종 영상 저장
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ github.run_number }}
          path: output/KO/video/final.mp4
          retention-days: 30

      - name: 📋 관리자 서버에 영상 등록
        continue-on-error: true
        env:
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          if [ -z "$ADMIN_BASE_URL" ]; then
            echo "⚠️ ADMIN_BASE_URL 미설정, 건너뜀"
            exit 0
          fi
          TODAY=$(date -u +"%Y-%m-%d")
          curl -s -X POST \
            -H "X-Internal-Token: $INTERNAL_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"date\":\"${TODAY}\",\"title\":\"${TODAY} KBS 머니올라 주식 브리핑\",\"voice_id_used\":\"${ELEVENLABS_VOICE_ID}\"}" \
            "$ADMIN_BASE_URL/internal/videos" && echo "✅ 등록 완료" || echo "⚠️ 등록 실패 (파이프라인 영향 없음)"
