name: 🎙️ Generate Voice Dubbing

on:
  workflow_run:
    workflows: ["📝 Generate Broadcast Script"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Python 패키지 설치
        # voice_config.py import 및 generate_voice.py 정상 실행에 필요한 모든 패키지
        run: |
          pip install \
            requests \
            Pillow>=10.0.0

      - name: 📥 script artifact 다운로드
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: generate_script.yml
          name: generated-script-latest
          path: output/KO/scripts/
          if_no_artifact_found: fail
          workflow_conclusion: success

      - name: 🔍 script.json 내용 확인
        run: |
          echo "📋 script.json 섹션 목록:"
          python -c "
          import json, os
          with open('output/KO/scripts/script.json') as f:
              data = json.load(f)
          sections = data.get('sections', [])
          print(f'  총 섹션: {len(sections)}개')
          total_chars = 0
          for s in sections:
              sid = s.get('id', '')
              narr = s.get('narration', '') or s.get('narration_summary', '')
              total_chars += len(narr)
              print(f'  [{sid}] narration: {len(narr)}자')
          print(f'  전체 나레이션: {total_chars}자 (목표: 약 7,500자 = 10분)')
          "

      - name: 🎙️ 더빙 생성
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          echo "🎙️ TTS 생성 시작..."
          python pipeline/generate_voice.py KO
          echo "📋 생성된 오디오 파일:"
          ls -lh output/KO/audio/*.mp3 2>/dev/null | wc -l
          echo "개 파일 생성됨"

      - name: 💾 결과물 저장
        uses: actions/upload-artifact@v4
        with:
          name: generated-voice-latest
          path: output/KO/audio/
          retention-days: 30
          overwrite: true
