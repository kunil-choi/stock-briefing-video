name: 📡 Daily 15m Stock Broadcast

on:
  schedule:
    - cron: "0 21 * * 0-4"  # KST 06:00 Mon-Fri
  workflow_dispatch:

permissions:
  contents: read

jobs:
  script:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install openai playwright Pillow pandas matplotlib pykrx requests python-dotenv
          playwright install chromium
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python pipeline/generate_script.py KO
      - uses: actions/upload-artifact@v4
        with:
          name: script
          path: output/KO/scripts/

  voice:
    needs: script
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests 'Pillow>=10.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: script
          path: output/KO/scripts/
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python pipeline/generate_voice.py KO
      - uses: actions/upload-artifact@v4
        with:
          name: voice
          path: output/KO/audio/

  assets:
    needs: [script]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra ffmpeg
          fc-cache -fv
          pip install requests 'Pillow>=10.0.0' pykrx matplotlib pandas mplfinance python-dotenv
      - uses: actions/download-artifact@v4
        with:
          name: script
          path: output/KO/scripts/
      - run: python pipeline/generate_assets.py KO
      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: output/KO/frames/

  video:
    needs: [script, voice, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra ffmpeg libass-dev libass9
          fc-cache -fv
          pip install requests 'Pillow>=10.0.0' 'openai>=1.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: script
          path: output/KO/scripts/
      - uses: actions/download-artifact@v4
        with:
          name: voice
          path: output/KO/audio/
      - name: Normalize voice artifact files
        run: |
          python - <<'PY'
          import glob, os, shutil
          target = 'output/KO/audio'
          os.makedirs(target, exist_ok=True)
          files = glob.glob(os.path.join(target, '**', '*'), recursive=True)
          copied = 0
          for src in files:
              if not os.path.isfile(src):
                  continue
              dst = os.path.join(target, os.path.basename(src))
              if os.path.abspath(src) == os.path.abspath(dst):
                  continue
              shutil.copy2(src, dst)
              copied += 1
          print(f'normalized audio files: {copied}')
          for p in sorted(glob.glob(os.path.join(target, '*'))):
              print(p)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: output/KO/frames/
      - name: Normalize asset artifact files
        run: |
          python - <<'PY'
          import glob, os, shutil
          target = 'output/KO/frames'
          os.makedirs(target, exist_ok=True)
          files = glob.glob(os.path.join(target, '**', '*.png'), recursive=True)
          copied = 0
          for src in files:
              dst = os.path.join(target, os.path.basename(src))
              if os.path.abspath(src) == os.path.abspath(dst):
                  continue
              shutil.copy2(src, dst)
              copied += 1
          print(f'normalized frame files: {copied}')
          for p in sorted(glob.glob(os.path.join(target, '*.png'))):
              print(p)
          PY
      - run: |
          python - <<'PY'
          import glob, json, os
          frames = sorted(glob.glob('output/KO/frames/*.png'))
          os.makedirs('output/KO', exist_ok=True)
          json.dump({'frames': frames, 'lang': 'KO'}, open('output/KO/asset_map.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
          print(f'frames={len(frames)}')
          PY
      - run: python pipeline/generate_subtitles.py KO
      - env:
          TARGET_MIN_SECONDS: "870"
          TARGET_MAX_SECONDS: "930"
        run: |
          python pipeline/generate_video.py KO
          python pipeline/quality_gate.py KO
      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: output/KO/video/final.mp4
