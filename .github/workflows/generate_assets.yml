name: 🖼️ Generate Assets

on:
  workflow_run:
    workflows: ["🎙️ Generate Voice Dubbing"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔤 한글 폰트 · ffmpeg 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            ffmpeg
          fc-cache -fv

      - name: 📦 Python 패키지 설치
        run: |
          pip install \
            requests \
            "Pillow>=10.0.0" \
            pykrx \
            matplotlib \
            pandas \
            mplfinance \
            python-dotenv

      - name: 📥 script artifact 다운로드
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: generate_script.yml
          name: generated-script-latest
          path: output/KO/scripts/
          if_no_artifact_found: fail
          workflow_conclusion: success

      - name: 🖼️ 자료 화면 제작 (PNG 프레임 생성)
        run: |
          echo "🖼️ PNG 프레임 생성 시작..."
          python pipeline/generate_assets.py KO
          echo "📋 생성된 프레임 목록:"
          ls output/KO/frames/*.png 2>/dev/null | while read f; do echo "  $(basename $f)"; done
          echo "총 $(ls output/KO/frames/*.png 2>/dev/null | wc -l)개 프레임"

      - name: 💾 결과물 저장
        uses: actions/upload-artifact@v4
        with:
          name: generated-assets-${{ github.run_number }}
          path: output/KO/frames/
          retention-days: 30
